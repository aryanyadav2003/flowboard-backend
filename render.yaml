    name: comment-service
    env: docker
    dockerContext: .
    dockerfilePath: src/Services/FlowBoard.CommentService/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5006
      - key: ASPNETCORE_URLS
        value: http://+:5006
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Jwt__Key
        fromService:
          type: web
          name: flowboard-gateway
          envVar: Jwt__Key
      - key: Jwt__Issuer
        value: FlowBoard
      - key: Jwt__Audience
        value: FlowBoardUsers

  # ── Label Service ───────────────────────────────────────────────
  - type: web
    name: label-service
    env: docker
    dockerContext: .
    dockerfilePath: src/Services/FlowBoard.LabelService/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5007
      - key: ASPNETCORE_URLS
        value: http://+:5007
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Jwt__Key
        fromService:
          type: web
          name: flowboard-gateway
          envVar: Jwt__Key
      - key: Jwt__Issuer
        value: FlowBoard
      - key: Jwt__Audience
        value: FlowBoardUsers

  # ── Checklist Service ───────────────────────────────────────────
  - type: web
    name: checklist-service
    env: docker
    dockerContext: .
    dockerfilePath: src/Services/FlowBoard.ChecklistService/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5008
      - key: ASPNETCORE_URLS
        value: http://+:5008
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: Jwt__Key
        fromService:
          type: web
          name: flowboard-gateway
          envVar: Jwt__Key
      - key: Jwt__Issuer
        value: FlowBoard
      - key: Jwt__Audience
        value: FlowBoardUsers

  # ── Redis (as a Web Service for Free Tier) ───────────────────────
  - type: web
    name: flowboard-redis
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Redis.Dockerfile

databases:
  - name: flowboard-db
    plan: free
